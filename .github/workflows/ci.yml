name: Continous Integration

on:
  push:
    branches:
      - 'feature/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v6

      - name: Run unit tests
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
        
        name: Install dependencies
        run: npm ci

        name: Run Unit test
        run: npm test